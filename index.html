    `<div class="rwt-ax"><dt>${esc(ax.l)}</dt><dd>${ax.c.map(c=>
      `<span class="rwt-row"><i>${esc(c.l)}</i><b>${fmtComp(c,rSeason)}</b><u>${
        c.w.toFixed(2).slice(1)}</u></span>`).join('')}</dd></div>`).join('')}</dl>
  <p class="rwt-foot">Fouls are ranked in reverse — fewer is better.</p>`;

  const rBody = R.short
    ? `<div class="radarwrap">${radarChart(R.vals)}
        <div class="radarnote">
          <p class="thinwarn"><b>Sample too small to rank.</b></p>
          <p>${rSeason
            ? `Only <b>${Math.round(rSeason.q.min)}</b> minutes of recorded floor time in
               ${seasonLabel(rY)}; ranking needs more than ${RADAR_MIN_MIN}.`
            : 'No recorded floor time in this season.'}
             ${ss.length>1?'Try an earlier season.':''}</p>
        </div></div>`
    : R.thin
    ? `<div class="radarwrap">${radarChart(R.vals)}
        <div class="radarnote">
          <p class="thinwarn"><b>Peer pool too small to rank against.</b></p>
          <p>Only ${R.n} qualifying player${R.n===1?'':'s'} in <b>${esc(scopeLab)}</b> for
            ${seasonLabel(rY)}. Switch to the wider scope.</p>
        </div></div>`
    : `<div class="radarwrap">${radarChart(R.vals)}
        <div class="radarnote">
          <p>Percentile within <b>${esc(scopeLab)}</b>, ${seasonLabel(rY)} season,
             against <b>${R.n.toLocaleString()}</b> player${R.n===1?'':'s'}.</p>
          ${weightTable}
        </div></div>`;
  const radar=`<section class="pd-block">
    <div class="pd-bar"><h3>Percentile profile</h3>
      ${yearSel}
      <div class="seg2" data-group="radar">
        <button data-radar="class" aria-pressed="${DT.radar==='class'}">Same class</button>
        <button data-radar="pos" aria-pressed="${DT.radar==='pos'}">All ${esc(posOf(p))}s</button></div></div>
    ${rBody}
  </section>`;

  $('#out').innerHTML=head+table+trend+radar;
}

function empty(h,p){$('#out').innerHTML=`<div class="empty"><h3>${h}</h3><p>${p}</p></div>`;}

/* ── events ────────────────────────────── */
$('#nav').onclick=e=>{const b=e.target.closest('.nav-item');if(!b)return;
  view=b.dataset.view;
  if(view==='saved') mode='players';
  F.cls.clear();F.pos.clear();F.circ.clear();RF.pos.clear();
  stack=[{t:'board'}];setQ('');
  [...document.querySelectorAll('.nav-item')].forEach(n=>n.setAttribute('aria-current',n===b));
  render();};

$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.mode;setQ('');render();};

$('#back').onclick=back;

$('#crumb').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  const j=b.dataset.jump;
  if(j==='board')toBoard(); else if(j==='events')toBoard('events');
  else if(j==='players')toBoard('players'); else if(j==='back')back();};

$('#filters').addEventListener('click',e=>{
  const pv=e.target.closest('[data-per]');
  if(pv){per=pv.dataset.per;render();return;}
  const c=e.target.closest('.chip');if(!c)return;
  const w=c.parentElement.dataset.set, v=c.dataset.v;
  if(w==='un'){hideUnnamed=!hideUnnamed;render();return;}
  const set=w==='cls'?F.cls:w==='pos'?F.pos:w==='rpos'?RF.pos:F.circ;
  set.has(v)?set.delete(v):set.add(v);render();});

$('#out').addEventListener('click',e=>{
  const pg=e.target.closest('[data-pg]');
  if(pg){const v=pg.dataset.pg;
    page = v==='prev'?Math.max(1,page-1) : v==='next'?Math.min(lastPages,page+1) : +v;
    render(); const o=$('#out'); if(o.scrollIntoView)o.scrollIntoView({block:'start'}); return;}
  const pv=e.target.closest('[data-per]');
  if(pv){per=pv.dataset.per;render();return;}
  const c=e.target.closest('[data-trend],[data-radar],.srow');
  if(c&&here().t==='player'){
    if(c.dataset.trend!==undefined) DT.trend=c.dataset.trend;
    else if(c.dataset.radar!==undefined) DT.radar=c.dataset.radar;
    else if(c.classList.contains('srow')){
      const y=+c.dataset.season; DT.open = DT.open===y?null:y;}
    render(); return;}
  const s=e.target.closest('.star');
  if(s){e.stopPropagation();const n=+s.dataset.id;
    savedP.has(n)?savedP.delete(n):savedP.add(n);
    render();return;}
  const pl=e.target.closest('.plink');
  if(pl){go({t:'player',id:+pl.dataset.player});return;}
  const row=e.target.closest('.erow');
  if(row)openEvent(row.dataset.event);
});

$('#out').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  if(e.target.classList&&e.target.classList.contains('srow')){
    e.preventDefault(); const y=+e.target.dataset.season;
    DT.open = DT.open===y?null:y; render(); return;}
  if(!e.target.classList||!e.target.classList.contains('erow'))return;
  e.preventDefault();
  openEvent(e.target.dataset.event);
});

$('#out').addEventListener('change',e=>{
  const ry=e.target.closest('#radaryear');
  if(ry){DT.radarY=+ry.value;render();return;}
  const ps=e.target.closest('#pgsize');
  if(ps){pageSize=+ps.value;page=1;render();return;}
  const pe=e.target.closest('[data-pos-for]');
  if(pe){setPos(P(+pe.dataset.posFor),pe.value);return;}
});
function openEvent(id){RF.pos.clear();go({t:'event',id});}

/* search is debounced — at 86k rows a keystroke-per-render is jittery */
let qT=null;
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();
  clearTimeout(qT); qT=setTimeout(()=>{q=v;render();}, PLAYERS.length>5000?160:0);};

/* ═══════════════════════════════════════════════════════════════
   IMPORT UI
   ═══════════════════════════════════════════════════════════════ */
const dropEl=$('#drop'), dzEl=$('#dz'), fileEl=$('#file'),
      progEl=$('#prog'), barEl=$('#bar'), msgEl=$('#pmsg'), errEl=$('#droperr');
let busy=false;

const openDrop =()=>{dropEl.classList.add('on');errEl.classList.remove('on');};
const closeDrop=()=>{if(!busy)dropEl.classList.remove('on');};

$('#dropcancel').onclick=closeDrop;   /* #srcbtn is wired inside paintSource */
dzEl.onclick=()=>fileEl.click();
dzEl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileEl.click();}};
fileEl.onchange=e=>{const f=e.target.files[0]; if(f)run(f); e.target.value='';};
['dragenter','dragover'].forEach(t=>dzEl.addEventListener(t,e=>{e.preventDefault();dzEl.classList.add('hot');}));
['dragleave','drop'].forEach(t=>dzEl.addEventListener(t,e=>{e.preventDefault();dzEl.classList.remove('hot');}));
dzEl.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f)run(f);});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrop();});

let lastPaint=0;
async function say(text,pct){
  barEl.style.width=Math.round(pct*100)+'%';
  msgEl.innerHTML=esc(text)+' <b>'+Math.round(pct*100)+'%</b>';
  const now=performance.now();
  if(now-lastPaint>60){lastPaint=now; await new Promise(r=>setTimeout(r,0));}
}

async function run(file){
  if(busy) return;
  busy=true; errEl.classList.remove('on'); progEl.classList.add('on');
  $('#dropcancel').disabled=true; dzEl.style.pointerEvents='none';
  try{
    await say('Reading '+file.name, 0);
    const out=await importCSV(file,say);
    await say('Indexing', .95);
    PLAYERS=out.players; EVENTS=out.events;
    RANKS={}; RANKMETA={asOf:null,services:{}};
    savedP=new Set(); F.cls.clear(); F.pos.clear(); F.circ.clear(); RF.pos.clear();
    hideUnnamed=true;
    view='usa'; mode='players'; stack=[{t:'board'}]; setQ('');
    sortBoard='pts'; sortRoster='pts'; per='g';
    [...document.querySelectorAll('.nav-item')].forEach(n=>
      n.setAttribute('aria-current',n.dataset.view==='usa'));
    reindex();
    await say('Done', 1);
    paintSource();
    render();
    dropEl.classList.remove('on');
  }catch(err){
    console.error(err);
    errEl.textContent=err&&err.message?err.message:'Could not read that file.';
    errEl.classList.add('on');
  }finally{
    busy=false; progEl.classList.remove('on');
    $('#dropcancel').disabled=false; dzEl.style.pointerEvents='';
  }
}

function paintSource(){
  const el=$('#src');
  const fixed=PLAYERS.filter(p=>p.posManual).length;
  const fixLine=fixed?`<div class="fixline"><b>${fixed.toLocaleString()}</b> position${fixed===1?'':'s'} set by hand
      · <a href="#" id="fixexp">export</a> · <a href="#" id="fiximp">import</a></div>`:'';
  if(!IMPORT.active){
    el.innerHTML=`<b>Prototype data</b><br>22 players · 32 events
      <div><span class="tagline demo">Sample</span></div>${fixLine}
      <button id="srcbtn">Load real data…</button>`;
  }else{
    el.innerHTML=`<b>${esc(IMPORT.file)}</b><br>
      ${IMPORT.players.toLocaleString()} players · ${IMPORT.rows.toLocaleString()} event records<br>
      ${IMPORT.events.toLocaleString()} events · ${(IMPORT.ms/1000).toFixed(1)}s
      ${IMPORT.exactDup?`<br>${IMPORT.exactDup.toLocaleString()} exact repeats dropped`:''}
      ${IMPORT.merged?`<br>${IMPORT.merged.toLocaleString()} same-event rows merged`:''}
      ${IMPORT.dropped?`<br>${IMPORT.dropped.toLocaleString()} rows skipped`:''}
      <div><span class="tagline live">Live</span></div>${fixLine}
      <button id="srcbtn">Load another file…</button>`;
  }
  $('#srcbtn').onclick=openDrop;
  const ex=$('#fixexp'), im=$('#fiximp');
  if(ex) ex.onclick=e=>{e.preventDefault();
    const blob=new Blob([JSON.stringify(Object.fromEntries(POSFIX),null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='fau_position_overrides.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
  if(im) im.onclick=e=>{e.preventDefault(); posImportEl.click();};
}
const posImportEl=Object.assign(document.createElement('input'),{type:'file',accept:'.json'});
posImportEl.onchange=async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    const obj=JSON.parse(await f.text());
    Object.entries(obj).forEach(([k,v])=>{const n=narrowPos(v); if(n)POSFIX.set(k,n);});
    PLAYERS.forEach(applyPosFix); pfixSave(); rebuildBuckets(); paintSource(); render();
  }catch(err){ console.error(err); }
};

/* console handle — poke at the imported database from devtools:
   FAU.meta, FAU.players, FAU.find('devin booker'), FAU.events   */
window.FAU={get players(){return PLAYERS;}, get events(){return EVENTS;},
  get boards(){return BOARD;}, get meta(){return IMPORT;},
  find:s=>PLAYERS.filter(p=>p.q.includes(String(s).toLowerCase())).slice(0,25),
  get posfix(){return POSFIX;}, get buckets(){return BUCKETS;},
  seasons, setPos, load:run, render,
  stat:(a,k,pr)=>val(a,COL(k),pr||per), cols:COLS, trend:TREND,
  peerPool, peerMean, peerCount, spark:sparkChart,
  radar:RADAR, radarValues, radarPool, radarMin:RADAR_MIN_MIN, per40Floor:MIN40_FLOOR, peerSeasons};

pfixLoad();
reindex();
paintSource();
render();

/* ── bundled dataset ──────────────────────────────────────────
   If the site ships its own data, load it on open so a visitor never has to
   drag anything. Nothing bundled — or opened straight off the disk with
   file:// — and this quietly does nothing, leaving the drop zone exactly as
   it was. The file goes through run(), the same function the drop zone uses,
   so a bundled board and a dragged one cannot diverge.

     data/board.csv.gz   player data, gzipped   (data/board.csv also works)
     data/ranks.json     optional, from hs_hoops_rankings.py --snapshot   */
async function bootBundled(){
  const grab=async u=>{ try{ const r=await fetch(u,{cache:'no-cache'}); return r.ok?r:null; }
                        catch(e){ return null; } };

  let r=await grab('./data/board.csv.gz'), gz=!!r;
  if(!r){ r=await grab('./data/board.csv'); }
  if(!r) return;                       /* no bundle — the drop zone stands */

  openDrop();
  progEl.classList.add('on');
  dzEl.style.pointerEvents='none';
  msgEl.textContent='Downloading dataset';

  try{
    /* stream it so a big file shows progress instead of a dead page */
    const total=+(r.headers.get('content-length')||0);
    let blob;
    if(r.body&&total){
      const rd=r.body.getReader(), parts=[]; let got=0;
      for(;;){
        const {done,value}=await rd.read();
        if(done) break;
        parts.push(value); got+=value.length;
        msgEl.textContent='Downloading dataset  '
          +(got/1048576).toFixed(1)+' / '+(total/1048576).toFixed(0)+' MB';
      }
      blob=new Blob(parts);
    } else blob=await r.blob();

    if(gz){
      try{ blob=await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob(); }
      catch(e){ /* the host already un-gzipped it for us — use the bytes as they are */ }
    }
    await run(new File([blob],'board.csv'));

    /* ranks go on after run(), because run() clears them by design:
       a new dataset invalidates the old id-to-rank mapping. */
    const rr=await grab('./data/ranks.json');
    if(rr){ try{ applyRankSnapshot(await rr.json()); }
            catch(e){ console.warn('ranks.json could not be read:',e); } }
  }catch(err){
    console.error(err);
    errEl.textContent='Could not load the bundled dataset. '+(err.message||'');
    errEl.classList.add('on');
  }finally{
    progEl.classList.remove('on');
    dzEl.style.pointerEvents='';
  }
}
bootBundled();
</script>
